<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A 极简工具风 · 上岸罗盘 R180</title>
<style>
/* Style A · 极简工具风（Linear / Vercel Geist）
   几何：圆角 2px ｜ 边框 1px hairline #ebebeb ｜ 阴影 无
   排版：12/13px 高密度、负字距 -0.01em、等宽数字 tabular-nums、字重对比 400/560
   骨架：全宽高密度数据表格 + 行内快捷操作（悬停浮现）+ 顶部命令栏 */
*{box-sizing:border-box;margin:0}
body{font-family:"Inter",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:#111;font-size:13px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.bn{background:#111;color:#eee;font-size:11px;padding:5px 14px;display:flex;gap:12px}
.bn a{margin-left:auto;text-decoration:underline}
header{display:flex;align-items:center;gap:18px;height:44px;padding:0 14px;border-bottom:1px solid #ebebeb}
.logo{font-weight:600;font-size:13px;display:flex;gap:7px;align-items:center}
.logo i{width:16px;height:16px;background:#111;color:#fff;font-style:normal;font-size:9px;display:flex;align-items:center;justify-content:center;border-radius:2px}
nav{display:flex;gap:2px;font-size:12px;color:#666}
nav a{padding:3px 8px;border-radius:2px}
nav a:hover{background:#f5f5f5;color:#111}
nav .on{color:#111;font-weight:560;background:#f0f0f0}
.cmd{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid #ebebeb;border-radius:2px;height:26px;padding:0 8px;color:#999;font-size:11px;width:230px}
.cmd kbd{margin-left:auto;border:1px solid #e3e3e3;border-radius:2px;padding:0 4px;font-size:9px;font-family:inherit}
.bar{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid #ebebeb;flex-wrap:wrap}
.f{height:22px;padding:0 8px;font-size:11px;border:1px solid #ebebeb;border-radius:2px;background:#fff;color:#555;display:inline-flex;align-items:center;gap:4px}
.f:hover{border-color:#bbb;color:#111}
.f.on{background:#111;color:#fff;border-color:#111;font-weight:560}
.f b{font-weight:560}
.sep{width:1px;height:14px;background:#ebebeb;margin:0 4px}
.right{margin-left:auto;display:flex;gap:6px}
.pri{height:22px;padding:0 10px;font-size:11px;font-weight:560;background:#111;color:#fff;border:1px solid #111;border-radius:2px}
.meta{padding:6px 14px;font-size:11px;color:#999;border-bottom:1px solid #f4f4f4}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:560;text-transform:uppercase;letter-spacing:.05em;color:#999;text-align:left;padding:5px 10px;border-bottom:1px solid #ebebeb;white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid #f4f4f4;vertical-align:middle;white-space:nowrap}
tr:hover td{background:#fafafa}
tr.sel td{background:#f0f0f0}
.t{font-weight:560;font-size:12.5px}
.e{color:#999;font-size:11px}
.k{display:inline-block;font-size:10px;padding:1px 5px;border:1px solid #ebebeb;border-radius:2px;color:#666}
.k.b{border-color:#c7d8f5;color:#3b6fc4;background:#f5f9ff}
.g{color:#777;font-size:12px}
.dead{color:#c4442e;font-weight:560;font-size:11px}
.ops{opacity:0;display:flex;gap:4px;justify-content:flex-end}
tr:hover .ops{opacity:1}
.op{height:20px;padding:0 7px;font-size:10px;border:1px solid #ddd;border-radius:2px;background:#fff}
.op:hover{border-color:#111}
.pg{display:flex;gap:14px;align-items:center;padding:10px 14px;font-size:11px;color:#999}
.mob{display:none}
@media(max-width:767px){
 nav,.cmd,table{display:none}
 .mob{display:block}
 .row{display:flex;gap:8px;padding:9px 14px;border-bottom:1px solid #f0f0f0;align-items:baseline}
 .row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
 .row2{display:flex;gap:8px;padding:0 14px 9px;font-size:11px;color:#999}
}
</style>
<script src="assets/data.js"></script>
</head>
<body>
<div class="bn">A · 极简工具风 &nbsp;参考：Linear / Vercel Geist ｜ 圆角 2px · hairline 1px · 无阴影 · 高密度表格<a href="styles.html">← 返回风格选择</a></div>
<header>
  <span class="logo"><i>◆</i>上岸罗盘</span>
  <nav><a class="on" href="#">体制内</a><a href="#">校招</a><a href="#">编制</a><a href="#">日历</a><a href="#">更新</a></nav>
  <div class="cmd">⌕ 搜索岗位、单位、专业…<kbd>⌘K</kbd></div>
</header>
<div class="bar">
  <button class="f on">全部 <b>10,000+</b></button><button class="f">公务员</button><button class="f">事业编</button><button class="f">军队文职</button><button class="f">国企央企</button><button class="f">选调生</button>
  <span class="sep"></span>
  <button class="f">地点 ▾</button><button class="f">学历 ▾</button><button class="f">截止时间 ▾</button>
  <div class="right"><button class="f">筛选 · 3</button><button class="pri">一键匹配</button></div>
</div>
<div class="meta">10,000+ 条 · 更新于 12 小时前 · 排序：最新优先</div>
<table>
<thead><tr><th style="width:36%">岗位 / 单位</th><th>年份</th><th>类型</th><th>地点</th><th>学历</th><th>截止</th><th style="text-align:right">操作</th></tr></thead>
<tbody id="tb"></tbody>
</table>
<div class="mob" id="mb"></div>
<div class="pg"><span>1–20 / 10,000+</span><span style="margin-left:auto">‹ 上一页 · 下一页 ›</span></div>
<script>
const R=(window.DATA_POSITIONS||[]).slice(0,20);
const dl=(d,i)=>i===0?'<span class="dead">今日截止</span>':(d?d.slice(5,10):'—');
document.getElementById('tb').innerHTML=R.map((p,i)=>`
<tr class="${i===3?'sel':''}"><td><span class="t">${p.title}</span><span class="e">　${p.employer}</span></td>
<td class="g">${p.year}</td><td><span class="k${p.type==='省级公务员考试'?' b':''}">${p.type}</span></td>
<td class="g">${p.loc}</td><td class="g">${p.edu||'—'}</td><td>${dl(p.deadline,i)}</td>
<td><span class="ops"><button class="op">☆ 收藏</button><button class="op">报名 ↗</button></span></td></tr>`).join('');
document.getElementById('mb').innerHTML=R.map((p,i)=>`
<div><div class="row"><span class="t">${p.title}</span>${dl(p.deadline,i)}</div>
<div class="row2"><span>${p.employer}</span><span style="margin-left:auto">${p.loc}</span></div></div>`).join('');
</script>
</body>
</html>
