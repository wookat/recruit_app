<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校招信息 · 上岸罗盘 原型</title>
<link rel="stylesheet" href="assets/tokens.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tokens.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/data.js"></script>
</head>
<body data-page="campus" data-mobile="jobs" class="s-page t1 min-h-screen">

<main class="max-w-[1280px] mx-auto px-4 py-4">

  <!-- 板块识别条：校招 · 青色 -->
  <div class="flex items-center gap-2 mb-3">
    <span class="w-1.5 h-5 rounded-full bg-campus"></span>
    <h1 class="text-lg1 font-semibold">校招信息</h1>
    <span class="text-xs1 t3">共 18,896 条 · 更新于 9 小时前</span>
    <span class="flex-1"></span>
    <button class="btn-sec btn-sm hidden sm:inline-flex">↓ 导出 CSV</button>
  </div>

  <!-- 场景入口：与体制内同构的一行横滑 chips -->
  <div class="flex items-center gap-1.5 overflow-x-auto hide-scroll pb-1">
    <span class="chip-on !bg-campus !border-campus">全部</span>
    <span class="chip">校招汇总 5758</span>
    <span class="chip">免笔试 734</span>
    <span class="chip">内推码</span>
    <span class="chip">央国企校招 1684</span>
    <span class="chip">24-25 届可投 10399</span>
    <span class="chip">秋招</span><span class="chip">春招</span><span class="chip">实习</span><span class="chip">27 届秋招</span>
    <span class="w-px h-5 bg-line dark:bg-line-d shrink-0 mx-1"></span>
    <a class="chip" href="positions.html">体制内 ↗</a>
    <a class="chip" href="bianzhi.html">编制公告 ↗</a>
  </div>

  <!-- 工具栏（与体制内一致的骨架） -->
  <div class="mt-3 flex items-center gap-2">
    <div class="relative flex-1 max-w-xl">
      <svg class="absolute left-3 top-2.5 t3" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="input !pl-9" placeholder="搜索公司 / 岗位 / 行业 / 专业…"/>
    </div>
    <button class="btn-sec relative">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18M7 12h10m-7 7h4"/></svg>
      筛选
      <span class="absolute -top-1.5 -right-1.5 min-w-[18px] h-4.5 rounded-sm2 bg-campus text-white text-[10px] flex items-center justify-center">2</span>
    </button>
    <button class="btn-sec hidden sm:inline-flex">截止最近 ▾</button>
    <div class="hidden sm:flex seg">
      <button class="seg-item" title="表格视图"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18v14H3zM3 10h18M9 5v14"/></svg></button>
      <button class="seg-on" title="卡片视图"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></button>
    </div>
  </div>

  <div class="mt-2.5 flex items-center gap-1.5 flex-wrap">
    <span class="text-xs2 t3">已选</span>
    <span class="chip-on !h-6 !text-xs2 !bg-campus !border-campus">2027 届 ✕</span>
    <span class="chip-on !h-6 !text-xs2 !bg-campus !border-campus">本科可投 ✕</span>
    <button class="text-xs2 t3 hover:text-brand-600 underline underline-offset-2">清空</button>
  </div>

  <!-- 卡片视图（校招默认）：桌面 3 列 / 平板 2 列 / 移动 1 列 -->
  <div id="list-alt" class="mt-4 s-card overflow-hidden hidden"></div>
  <div id="list-normal">
  <div id="cards" class="mt-4 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
  </div>

  <div class="flex items-center justify-center mt-5">
    <button class="btn-sec">加载更多（第 1–24 / 18,896 条）</button>
  </div>
</main>

<script>
const PALETTE = [['bg-orange-100 dark:bg-orange-900/50','text-orange-700 dark:text-orange-300'],['bg-blue-100 dark:bg-blue-900/50','text-blue-700 dark:text-blue-300'],['bg-emerald-100 dark:bg-emerald-900/50','text-emerald-700 dark:text-emerald-300'],['bg-violet-100 dark:bg-violet-900/50','text-violet-700 dark:text-violet-300'],['bg-rose-100 dark:bg-rose-900/50','text-rose-700 dark:text-rose-300'],['bg-teal-100 dark:bg-teal-900/50','text-teal-700 dark:text-teal-300']];
const TODAY = new Date('2026-08-04');
function dl(d){ if(!d) return '<span class="tag-gray">详见公告</span>';
  const days = Math.round((new Date(d)-TODAY)/86400000);
  if(days<=0) return '<span class="tag-red">今日截止</span>';
  if(days<=3) return `<span class="tag-amber">${days} 天后截止</span>`;
  return `<span class="text-xs2 t3">${d.slice(5)} 截止</span>`; }
function render(){
  const data = window.DATA_CAMPUS || [];
  document.getElementById('cards').innerHTML = data.map((c,i)=>{
    const [bg,fg] = PALETTE[i % PALETTE.length];
    const star = i===1;
    return `<article class="s-card p-4 hover:shadow-raised transition-shadow cursor-pointer group" tabindex="0">
      <div class="flex items-start gap-2.5">
        <span class="w-10 h-10 rounded-md2 ${bg} ${fg} flex items-center justify-center font-semibold shrink-0 text-body">${c.company.slice(0,1)}</span>
        <div class="flex-1 min-w-0">
          <div class="font-medium truncate group-hover:text-brand-600 transition-colors">${c.company}</div>
          <div class="text-xs1 t3 truncate mt-0.5">${c.positions || c.industry}</div>
        </div>
        <button class="${star?'text-amber-400':'t3 hover:text-amber-500'} text-lg leading-none min-w-[28px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring rounded" aria-label="收藏" onclick="event.stopPropagation();this.textContent=this.textContent.trim()==='☆'?'★':'☆';this.classList.toggle('text-amber-400')">${star?'★':'☆'}</button>
      </div>
      <div class="flex flex-wrap items-center gap-1.5 mt-3">
        <span class="tag-teal">${c.batch||'校招'}</span>
        ${c.grad?`<span class="tag-blue">${c.grad}</span>`:''}
        ${c.noexam && c.noexam!=='/' ? `<span class="tag-green">${c.noexam}</span>`:''}
        <span class="tag-gray">${c.ctype}</span>
      </div>
      <div class="text-xs1 t2 mt-2.5 pb-2.5 border-b border-line dark:border-line-d truncate">${c.edu||'学历详见公告'}${c.loc?' · '+c.loc:''}</div>
      <div class="flex items-center gap-2 mt-2.5">
        <button class="btn-pri btn-sm flex-1">投递 ↗</button>
        <button class="btn-sec btn-sm">公告</button>
        <span class="ml-auto">${dl(c.deadline)}</span>
      </div>
    </article>`;
  }).join('');
}
document.addEventListener('DOMContentLoaded', ()=>{ render(); initListStates({boards:[
  {label:'体制内',count:'10,000+ 条',href:'positions.html'},{label:'编制公告',count:'4,096 条',href:'bianzhi.html'}]}); });
</script>
</body>
</html>
