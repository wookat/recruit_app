<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --fg:#222222; --fg2:#5e5e5e; --fg3:#999999;
  --line:#eeeeee; --muted:#f5f6f8;
  --accent:#00a6a7; --accent-fg:#ffffff; --accent-weak:#e6f7f7; --accent-text:#00a6a7;
  --chip-on-bg:#e6f7f7; --chip-on-fg:#00a6a7; --chip-on-bd:#00a6a7;
  --r-ctl:6px; --r-btn:8px; --r-card:12px; --r-tag:4px; --r-badge:8px; --r-logo:8px;
  --ctl-h:36px; --chip-h:28px; --td-py:14px; --th-py:10px;
  --title-w:700; --title-s:15px;
  --row-hover:#fafcfc; --row-sel:#e6f7f7; --ring:rgba(0,166,167,.15);
  --card-shadow:0 2px 8px rgba(0,0,0,.04);
  --tag-bg:#f5f6f8; --tag-fg:#5e5e5e;
  --tag-b-bg:#e6f7f7; --tag-b-fg:#00a6a7; --tag-c-bg:#fff3e5; --tag-c-fg:#e07f00;
  --danger:#fa5151; --banner-bg:#00a6a7; --banner-fg:#fff;
}
.sd-title{color:#222}
.sd-tbl tbody tr:hover .sd-title,.sd-mcard:active .sd-title{color:var(--accent)}
.sd-btn-pri{font-weight:600}
.sd-nav-on{position:relative;background:transparent;color:var(--accent)}
.sd-nav-on::after{content:'';position:absolute;left:10px;right:10px;bottom:-4px;height:3px;border-radius:2px;background:var(--accent)}
.sd-danger{background:#fff0f0;padding:2px 6px;border-radius:4px}
</style>
