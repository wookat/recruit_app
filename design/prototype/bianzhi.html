<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编制公告 · 上岸罗盘 原型</title>
<link rel="stylesheet" href="assets/tokens.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tokens.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/data.js"></script>
</head>
<body data-page="bianzhi" data-mobile="jobs" class="s-page t1 min-h-screen">

<main class="max-w-[1280px] mx-auto px-4 py-4">

  <div class="flex items-center gap-2 mb-3">
    <span class="w-1.5 h-5 rounded-full bg-bianzhi"></span>
    <h1 class="text-lg1 font-semibold">编制公告</h1>
    <span class="text-xs1 t3">共 37,833 条 · 更新于 9 小时前</span>
    <span class="flex-1"></span>
    <button class="btn-sec btn-sm hidden sm:inline-flex">🏛 各省人社官网</button>
    <button class="btn-sec btn-sm hidden sm:inline-flex">🎓 专业就业方向</button>
  </div>

  <!-- 分类：与其他板块同构的一行横滑 chips（带计数） -->
  <div class="flex items-center gap-1.5 overflow-x-auto hide-scroll pb-1">
    <span class="chip-on !bg-bianzhi !border-bianzhi">全部</span>
    <span class="chip">公务员事业单位 9,444</span>
    <span class="chip">教育系统 7,118</span>
    <span class="chip">医疗系统 6,810</span>
    <span class="chip">高校高职大专 9,435</span>
    <span class="chip">科研院所 1,376</span>
    <span class="chip">央国企社招 3,551</span>
    <span class="chip">大型联考 99</span>
    <span class="w-px h-5 bg-line dark:bg-line-d shrink-0 mx-1"></span>
    <a class="chip" href="positions.html">体制内 ↗</a>
    <a class="chip" href="campus.html">校招 ↗</a>
  </div>

  <div class="mt-3 flex items-center gap-2">
    <div class="relative flex-1 max-w-xl">
      <svg class="absolute left-3 top-2.5 t3" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="input !pl-9" placeholder="搜索招聘单位 / 工作地 / 专业…"/>
    </div>
    <button class="btn-sec relative">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18M7 12h10m-7 7h4"/></svg>
      筛选
      <span class="absolute -top-1.5 -right-1.5 min-w-[18px] h-4.5 rounded-sm2 bg-bianzhi text-white text-[10px] flex items-center justify-center">1</span>
    </button>
    <button class="btn-sec hidden sm:inline-flex">最新优先 ▾</button>
  </div>

  <div class="mt-2.5 flex items-center gap-1.5 flex-wrap">
    <span class="text-xs2 t3">已选</span>
    <span class="chip-on !h-6 !text-xs2 !bg-bianzhi !border-bianzhi">广东 · 全部城市 ✕</span>
    <button class="text-xs2 t3 hover:text-brand-600 underline underline-offset-2">清空</button>
  </div>

  <div id="list-alt" class="mt-4 s-card overflow-hidden hidden"></div>
  <div id="list-normal">
  <!-- 桌面：公告列表（表格，行由 assets/data.js 真实数据渲染） -->
  <div class="mt-4 s-card overflow-hidden hidden md:block">
    <table class="tbl w-full">
      <thead><tr><th class="w-8"></th><th>招聘单位 / 公告</th><th>分类</th><th>工作地</th><th>学历要求</th><th>专业/学科</th><th>截止</th><th class="w-20"></th></tr></thead>
      <tbody id="rows-desktop"></tbody>
    </table>
    <div class="flex items-center justify-between px-4 h-12 text-xs1 t3">
      <span>第 1–50 条 / 37,833</span>
      <div class="flex gap-1"><button class="btn-sec btn-sm">上一页</button><button class="btn-sec btn-sm">下一页</button></div>
    </div>
  </div>

  <!-- 移动：紧凑公告卡（数据渲染） -->
  <div id="rows-mobile" class="md:hidden mt-4 s-card divide-y divide-line dark:divide-line-d overflow-hidden"></div>
  </div><!-- /#list-normal -->

  <!-- 省份分布（图形化，替代旧版 pill 计数墙） -->
  <div class="mt-4 s-card p-4 max-w-3xl">
    <div class="flex items-baseline justify-between">
      <h3 class="text-body font-semibold">按省份分布 · 点击筛选</h3>
      <button class="text-xs2 text-brand-600">全部 31 省 ▾</button>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-x-6 gap-y-2.5 mt-3">
      <button class="group"><div class="flex justify-between text-xs1"><span class="t2 group-hover:text-brand-600">广东</span><span class="t3">4,552</span></div><div class="h-1.5 rounded-full bg-surface-sunken dark:bg-surface-sunken-d mt-1"><div class="h-1.5 rounded-full bg-bianzhi" style="width:100%"></div></div></button>
      <button class="group"><div class="flex justify-between text-xs1"><span class="t2 group-hover:text-brand-600">北京</span><span class="t3">3,607</span></div><div class="h-1.5 rounded-full bg-surface-sunken dark:bg-surface-sunken-d mt-1"><div class="h-1.5 rounded-full bg-bianzhi/80" style="width:79%"></div></div></button>
      <button class="group"><div class="flex justify-between text-xs1"><span class="t2 group-hover:text-brand-600">四川</span><span class="t3">3,122</span></div><div class="h-1.5 rounded-full bg-surface-sunken dark:bg-surface-sunken-d mt-1"><div class="h-1.5 rounded-full bg-bianzhi/70" style="width:69%"></div></div></button>
      <button class="group"><div class="flex justify-between text-xs1"><span class="t2 group-hover:text-brand-600">浙江</span><span class="t3">2,918</span></div><div class="h-1.5 rounded-full bg-surface-sunken dark:bg-surface-sunken-d mt-1"><div class="h-1.5 rounded-full bg-bianzhi/60" style="width:64%"></div></div></button>
      <button class="group"><div class="flex justify-between text-xs1"><span class="t2 group-hover:text-brand-600">江苏</span><span class="t3">2,264</span></div><div class="h-1.5 rounded-full bg-surface-sunken dark:bg-surface-sunken-d mt-1"><div class="h-1.5 rounded-full bg-bianzhi/50" style="width:50%"></div></div></button>
      <button class="group"><div class="flex justify-between text-xs1"><span class="t2 group-hover:text-brand-600">上海</span><span class="t3">1,937</span></div><div class="h-1.5 rounded-full bg-surface-sunken dark:bg-surface-sunken-d mt-1"><div class="h-1.5 rounded-full bg-bianzhi/40" style="width:43%"></div></div></button>
    </div>
  </div>
</main>

<script>
const TODAY = new Date('2026-08-04');
function catTag(c){ return /高校|高职|大专/.test(c) ? `<span class="tag-purple">${c}</span>` : /国企|央企/.test(c) ? `<span class="tag-amber">${c}</span>` : `<span class="tag-teal">${c||'公告'}</span>`; }
function dl(d){ if(!d) return '<span class="t2">详见正文</span>';
  const days = Math.round((new Date(d)-TODAY)/86400000);
  if(days<=0) return '<span class="tag-red">今日截止</span>';
  if(days<=3) return `<span class="tag-amber">${days} 天后</span>`;
  return `<span class="t2">${d.slice(5)}</span>`; }
function render(){
  const data = window.DATA_BIANZHI || [];
  document.getElementById('rows-desktop').innerHTML = data.map((b,i)=>`
    <tr tabindex="0">
      <td><button class="${i===2?'text-amber-400':'t3 hover:text-amber-500'} focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring rounded" onclick="event.stopPropagation();this.textContent=this.textContent==='☆'?'★':'☆';this.classList.toggle('text-amber-400')">${i===2?'★':'☆'}</button></td>
      <td><div class="font-medium max-w-md">${b.title}</div></td>
      <td>${catTag(b.cat)}</td>
      <td class="t2">${b.loc||b.prov||'—'}</td>
      <td>${b.edu?`<span class="tag-blue">${b.edu}</span>`:'<span class="tag-gray">详见公告</span>'}</td>
      <td class="t2 max-w-[220px] truncate">${b.major||'—'}</td>
      <td>${dl(b.deadline)}</td>
      <td><span class="text-brand-600 text-xs1 font-medium">公告 ↗</span></td>
    </tr>`).join('');
  document.getElementById('rows-mobile').innerHTML = data.map((b,i)=>`
    <div class="p-3.5 min-h-[44px]">
      <div class="flex items-start gap-2">
        <div class="font-medium flex-1">${b.title}</div>
        <button class="${i===2?'text-amber-400':'t3'} text-lg leading-none min-w-[44px] min-h-[44px] -m-2" onclick="this.textContent=this.textContent.trim()==='☆'?'★':'☆';this.classList.toggle('text-amber-400')">${i===2?'★':'☆'}</button>
      </div>
      <div class="flex items-center gap-1.5 mt-2 flex-wrap">
        ${catTag(b.cat)}${b.edu?`<span class="tag-blue">${b.edu}</span>`:''}
        <span class="text-xs2 t3">${b.loc||b.prov||''}${b.major?' · '+b.major.slice(0,14)+'…':''}</span>
        <span class="ml-auto text-xs2">${dl(b.deadline)}</span>
      </div>
    </div>`).join('');
}
document.addEventListener('DOMContentLoaded', ()=>{ render(); initListStates({boards:[
  {label:'体制内',count:'10,000+ 条',href:'positions.html'},{label:'校招',count:'2,113 条',href:'campus.html'}]}); });
</script>
</body>
</html>
