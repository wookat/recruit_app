<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体制内岗位 · 卡片视图 · 上岸罗盘 原型</title>
<link rel="stylesheet" href="assets/tokens.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tokens.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/data.js"></script>
</head>
<body data-page="positions" data-mobile="jobs" class="s-page t1 min-h-screen">

<main class="max-w-[1280px] mx-auto px-4 py-4">
  <div class="flex items-center gap-1.5 overflow-x-auto hide-scroll pb-1">
    <span class="chip-on">全部 <span class="opacity-80">10,000+</span></span>
    <span class="chip">公务员</span><span class="chip">事业编</span><span class="chip">军队文职</span>
    <span class="chip">国企央企</span><span class="chip">选调生</span>
    <span class="chip text-rose-600 border-rose-200 dark:border-rose-900">⏰ 即将截止 20</span>
  </div>

  <div class="mt-3 flex items-center gap-2">
    <div class="relative flex-1 max-w-xl">
      <svg class="absolute left-3 top-2.5 t3" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="input !pl-9" placeholder="搜索岗位、单位、专业、地点…"/>
    </div>
    <button class="btn-sec">筛选</button>
    <button class="btn-sec hidden sm:inline-flex">最新优先 ▾</button>
    <div class="hidden sm:flex items-center rounded-md2 border border-line dark:border-line-d overflow-hidden">
      <button onclick="location.href='positions.html'" class="h-9 px-2.5 t3 hover:bg-surface-sunken dark:hover:bg-surface-sunken-d" title="表格视图"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18v14H3zM3 10h18M9 5v14"/></svg></button>
      <button class="h-9 px-2.5 bg-brand-600 text-white" title="卡片视图"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></button>
    </div>
  </div>

  <!-- 卡片视图：桌面 3 列，突出截止与竞争信息 -->
  <div id="list-alt" class="mt-4 s-card overflow-hidden hidden"></div>
  <div id="list-normal">
  <div id="cards" class="mt-4 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3"></div>
  </div>

  <div class="flex items-center justify-center mt-5">
    <button class="btn-sec">加载更多（第 1–24 / 10,000+ 条）</button>
  </div>
</main>

<script>
const TODAY = new Date('2026-08-04');
function dl(d){ if(!d) return '<span class="tag-gray">详见公告</span>';
  const days = Math.round((new Date(d.slice(0,10))-TODAY)/86400000);
  if(days<=0) return '<span class="tag-red">今日截止</span>';
  if(days<=3) return `<span class="tag-amber">${days} 天后截止</span>`;
  return `<span class="text-xs2 t3">${d.slice(5,10)} 截止</span>`; }
function render(){
  const data = window.DATA_POSITIONS || [];
  document.getElementById('cards').innerHTML = data.map((p,i)=>{
    const star = i===1;
    return `<article class="s-card p-4 hover:shadow-raised transition-shadow cursor-pointer group" tabindex="0">
      <div class="flex items-start gap-2">
        <div class="flex-1 min-w-0">
          <div class="font-medium group-hover:text-brand-600 transition-colors line-clamp-2">${p.title}</div>
          <div class="text-xs1 t3 truncate mt-1">${p.employer}</div>
        </div>
        <button class="${star?'text-amber-400':'t3 hover:text-amber-500'} text-lg leading-none min-w-[28px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring rounded" aria-label="收藏" onclick="event.stopPropagation();this.textContent=this.textContent.trim()==='☆'?'★':'☆';this.classList.toggle('text-amber-400')">${star?'★':'☆'}</button>
      </div>
      <div class="flex flex-wrap items-center gap-1.5 mt-3">
        <span class="tag-blue">${p.year}</span><span class="tag-gray">${p.type}</span>
        ${p.edu?`<span class="tag-gray">${p.edu}</span>`:''}
      </div>
      <div class="text-xs1 t2 mt-2.5 pb-2.5 border-b border-line dark:border-line-d truncate">📍 ${p.loc||'详见公告'}${p.major?' · '+p.major:''}</div>
      <div class="flex items-center gap-2 mt-2.5">
        <button class="btn-pri btn-sm flex-1">报名 ↗</button>
        <button class="btn-sec btn-sm">详情</button>
        <span class="ml-auto">${dl(p.deadline)}</span>
      </div>
    </article>`;
  }).join('');
}
document.addEventListener('DOMContentLoaded', ()=>{ render(); initListStates({boards:[
  {label:'校招',count:'2,113 条',href:'campus.html'},{label:'编制公告',count:'4,096 条',href:'bianzhi.html'}]}); });
</script>
</body>
</html>
