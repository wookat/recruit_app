services:
  postgres:
    image: postgres:16
    container_name: recruit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: recruit
      POSTGRES_PASSWORD: recruit
      POSTGRES_DB: recruit
    # 并行查询的动态共享内存放在 /dev/shm，docker 默认 64MB 会导致
    # 「could not resize shared memory segment: No space left on device」
    shm_size: 256mb
    command: >-
      postgres -c shared_buffers=192MB -c effective_cache_size=512MB
      -c work_mem=8MB -c maintenance_work_mem=64MB -c max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruit -d recruit"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: recruit-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  app:
    build: .
    image: recruit-app:latest
    container_name: recruit-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://recruit:recruit@postgres:5432/recruit
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUB: ${VAPID_SUB:-mailto:admin@zalize.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
    volumes:
      - ./exports:/app/exports
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: recruit-app:latest
    container_name: recruit-worker
    restart: unless-stopped
    # 2 核小机上每日同步（北京 6:00–7:30）曾把在线查询拖到 10–73s：
    # 降低 worker CPU 权重 + nice，让 app/postgres 在争抢时优先
    cpu_shares: 256
    command: ["nice", "-n", "10", "celery", "-A", "celery_app", "worker", "-B", "--loglevel=info", "--concurrency=1"]
    volumes:
      - ./exports:/app/exports
    environment:
      DATABASE_URL: postgresql://recruit:recruit@postgres:5432/recruit
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUB: ${VAPID_SUB:-mailto:admin@zalize.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
